  ai: { title: 'AI và chuyển đổi số cho người làm xây dựng', author: 'Claude biên soạn', genre: 'tech', sub: 'Chuyển đổi số', level: 'Người đi làm', ch: [
    { t: 'Chuyển đổi số là gì', p: ['Chuyển đổi số không chỉ là mua phần mềm, mà là thay đổi cách làm việc dựa trên dữ liệu: thông tin được ghi nhận một lần, dùng chung nhiều nơi, cập nhật theo thời gian thực.', 'Trong xây dựng, đó là chuyển từ hồ sơ giấy, file Excel rời rạc sang hệ thống quản lý tập trung: khối lượng, chi phí, tiến độ, chất lượng liên kết với nhau.', 'Bắt đầu nhỏ: số hóa một quy trình đau đầu nhất (ví dụ hồ sơ thanh toán), đo hiệu quả rồi mở rộng.'] },
    { t: 'BIM và dữ liệu công trình', p: ['BIM (mô hình thông tin công trình) là mô hình 3D chứa thông tin về vật liệu, khối lượng, tiến độ (4D) và chi phí (5D).', 'Lợi ích: phát hiện xung đột thiết kế sớm, bóc khối lượng nhanh và chính xác hơn, phối hợp giữa các bên thuận lợi.', 'Với người làm kinh tế xây dựng, dữ liệu từ BIM giúp lập dự toán, kiểm soát phát sinh và quyết toán minh bạch.'] },
    { t: 'Dashboard và báo cáo tự động', p: ['Thay vì tổng hợp báo cáo thủ công mỗi tuần, hãy xây bảng điều khiển (dashboard) bằng Power BI hoặc công cụ tương tự, lấy dữ liệu trực tiếp từ các bảng tính chuẩn hóa.', 'Các chỉ số nên theo dõi: giá trị thực hiện so với kế hoạch, giá trị thanh toán, dòng tiền, tiến độ đường găng, số phát sinh chờ duyệt.', 'Quy tắc: một nguồn dữ liệu – nhiều báo cáo. Chuẩn hóa mã hạng mục ngay từ đầu.'] },
    { t: 'Dùng trợ lý AI hiệu quả', p: ['Trợ lý AI có thể giúp soạn thư, tóm tắt hồ sơ dài, so sánh điều khoản hợp đồng, viết công thức Excel, phác thảo báo cáo.', 'Viết yêu cầu rõ ràng: bối cảnh, mục tiêu, định dạng mong muốn, ví dụ mẫu. Ví dụ: "Tóm tắt 5 rủi ro chính trong điều khoản thanh toán sau, dạng bảng."', 'Luôn kiểm tra lại số liệu và căn cứ pháp lý – AI là trợ lý, người chịu trách nhiệm cuối cùng vẫn là bạn.'] },
    { t: 'Bảo mật và lộ trình áp dụng', p: ['Không đưa thông tin mật của dự án hoặc dữ liệu cá nhân vào công cụ chưa được tổ chức cho phép.', 'Lộ trình gợi ý: (1) chuẩn hóa dữ liệu và biểu mẫu, (2) số hóa quy trình chính, (3) xây dashboard, (4) ứng dụng AI cho các việc lặp lại.', 'Đào tạo con người là yếu tố quyết định: công cụ tốt mà không ai dùng thì không tạo ra giá trị.'] }
  ] },
  dutoan: { title: 'Nhập môn dự toán và kiểm soát chi phí xây dựng', author: 'Claude biên soạn', genre: 'pro', sub: 'Quản lý chi phí xây dựng', level: 'Cơ bản', ch: [
    { t: 'Chi phí xây dựng gồm những gì', p: ['Một cách khái quát, chi phí của dự án gồm: chi phí xây dựng, thiết bị, quản lý dự án, tư vấn, chi phí khác và dự phòng. Cách phân loại chi tiết theo quy định hiện hành – cần tra cứu văn bản mới nhất khi áp dụng.', 'Chi phí xây dựng thường gồm chi phí trực tiếp (vật liệu, nhân công, máy thi công) và các chi phí gián tiếp, thu nhập chịu thuế tính trước, thuế.', 'Hiểu rõ cấu trúc chi phí giúp bạn biết khoản nào có thể tối ưu và khoản nào cần kiểm soát chặt.'] },
    { t: 'Bóc khối lượng', p: ['Khối lượng là nền móng của dự toán: sai khối lượng thì mọi con số phía sau đều sai.', 'Nguyên tắc: bóc theo bản vẽ và chỉ dẫn kỹ thuật, ghi rõ diễn giải cách tính để người khác kiểm tra được, thống nhất đơn vị đo.', 'Kiểm tra chéo bằng chỉ tiêu (ví dụ kg thép/m3 bê tông, m2 ván khuôn/m3 bê tông) để phát hiện sai sót lớn.'] },
    { t: 'Đơn giá và giá vật liệu', p: ['Đơn giá chi tiết được xây dựng từ định mức hao phí và giá vật liệu, nhân công, máy tại thời điểm và địa điểm lập.', 'Giá vật liệu biến động mạnh (thép, xi măng, cát…). Hãy theo dõi công bố giá của địa phương và báo giá thị trường, lưu lại nguồn để giải trình.', 'Với hạng mục lớn, nên có ít nhất 3 báo giá để so sánh.'] },
    { t: 'Dự phòng và trượt giá', p: ['Dự phòng gồm phần cho khối lượng phát sinh và phần cho yếu tố trượt giá theo thời gian thực hiện.', 'Dự án kéo dài càng lâu, rủi ro trượt giá càng lớn – cần đánh giá chỉ số giá và kế hoạch vốn.', 'Không nên dùng dự phòng như "quỹ đen"; mọi khoản sử dụng cần có căn cứ và phê duyệt.'] },
    { t: 'Kiểm soát chi phí trong thi công', p: ['Lập kế hoạch chi phí theo thời gian (đường cong S) và so sánh định kỳ với giá trị thực hiện và chi phí thực tế.', 'Ba câu hỏi mỗi kỳ báo cáo: đang vượt hay tiết kiệm? Ở hạng mục nào? Nguyên nhân và biện pháp?', 'Quản lý phát sinh chặt chẽ và cập nhật dự báo chi phí hoàn thành (EAC) giúp chủ đầu tư không bị bất ngờ khi quyết toán.'] }
  ] },
  thuyettrinh: { title: 'Kỹ năng thuyết trình và đàm phán cho nhà quản lý', author: 'Claude biên soạn', genre: 'skills', sub: 'Kỹ năng thuyết trình', level: 'Người đi làm', ch: [
    { t: 'Biết người nghe cần gì', p: ['Trước mỗi bài thuyết trình, trả lời ba câu: Ai nghe? Họ quan tâm điều gì? Sau buổi này tôi muốn họ quyết định hay làm gì?', 'Ban giám đốc quan tâm chi phí – rủi ro – thời gian; kỹ sư quan tâm giải pháp kỹ thuật; chủ đầu tư quan tâm hiệu quả và tiến độ bàn giao.', 'Cùng một nội dung, hãy điều chỉnh mức chi tiết và ví dụ cho phù hợp từng nhóm.'] },
    { t: 'Cấu trúc 3 phần', p: ['Mở đầu: nêu vấn đề và kết luận chính ngay từ đầu – người bận rộn cần biết điểm mấu chốt trước.', 'Thân bài: tối đa 3 ý, mỗi ý có số liệu hoặc ví dụ minh họa. Biểu đồ đơn giản tốt hơn bảng số dày đặc.', 'Kết thúc: tóm tắt và đề xuất hành động cụ thể, ai làm, khi nào.'] },
    { t: 'Nói tự tin', p: ['Luyện tập to tiếng ít nhất 2–3 lần, bấm giờ, ghi âm hoặc quay video để tự điều chỉnh.', 'Nói chậm, dừng ngắt sau ý quan trọng, nhìn vào người nghe thay vì đọc slide.', 'Chuẩn bị trước 5 câu hỏi khó có thể gặp và câu trả lời ngắn gọn.'] },
    { t: 'Chuẩn bị đàm phán', p: ['Xác định mục tiêu mong muốn, mức chấp nhận tối thiểu và phương án thay thế nếu không đạt thỏa thuận.', 'Tìm hiểu nhu cầu thật của đối phương – đôi khi họ cần tiến độ thanh toán nhanh hơn là giá cao hơn.', 'Chuẩn bị nhiều phương án để trao đổi: giá, khối lượng, thời hạn, điều kiện thanh toán, bảo hành.'] },
    { t: 'Trong bàn đàm phán', p: ['Lắng nghe nhiều, hỏi câu mở, nhắc lại ý đối phương để thể hiện sự thấu hiểu.', 'Nhượng bộ có điều kiện: "Nếu bên anh giao hàng sớm 2 tuần, chúng tôi có thể xem xét tạm ứng thêm." Không nhượng bộ miễn phí.', 'Chốt lại bằng văn bản ngay sau buổi làm việc: những điểm đã thống nhất, việc cần làm tiếp và thời hạn.'] }
  ] }
});

// ---- Trình đọc kiểu ebook: phân trang, vuốt trái/phải để lật trang ----
let RD = null;
function rdChapters(b) {
  if (RD.mode === 'sum') { const sm = sumOf(b.title); return [{ t: '📝 Tóm tắt ý chính', html: `<h2 class="rdh">📝 Tóm tắt ý chính<small>${esc(b.title)}${b.author ? ' – ' + esc(b.author) : ''}</small></h2>${sm ? `<ol class="rdsum">${sm.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="rdnote">Tóm tắt do Claude viết lại bằng lời mới để nắm nhanh nội dung – không thay thế sách gốc.</p>` : '<p>Chưa có tóm tắt cho cuốn này.</p>'}${b.takeaways ? `<h3>Ghi chú của bạn</h3><p style="white-space:pre-wrap">${esc(b.takeaways)}</p>` : ''}` }]; }
  if (RD.mode === 'txt') return RD.txtCh || [{ t: 'Đang tải…', html: '<p>Đang tải nội dung…</p>' }];
  const L = LIB[b.builtin];
  if (L.bi) return L.ch.map((c, i) => { const [te, tv] = c.t.split('|'), show = s => RD.lang === 'both' || RD.lang === s; return { t: te, html: `<h2 class="rdh">${i + 1}. ${esc(te)} ${spk(te)}<small>${esc(tv)}</small></h2>${c.p.map(x => { const [e, v] = x.split('|'); return `<p class="rdp">${show('en') ? `<span class="en">${esc(e)} ${spk(e)}</span>` : ''}${show('vi') ? `<span class="vi">${esc(v)}</span>` : ''}</p>`; }).join('')}<div class="rdm"><b>💡 Bài học:</b> ${show('en') ? esc(c.m.split('|')[0]) : ''}${RD.lang === 'both' ? '<br>' : ''}${show('vi') ? `<i>${esc(c.m.split('|')[1])}</i>` : ''}</div><div class="rdv"><b>Từ vựng:</b> ${c.v.map(x => { const [e, v] = x.split('|'); return `<span class="chip" data-act="say" data-t="${esc(e)}"><b>${esc(e)}</b> ${esc(v)}</span>`; }).join(' ')} <button class="btn sm" data-rd="cards" data-k="${i}">+ Thẻ từ</button></div>` }; });
  return L.ch.map((c, i) => ({ t: c.t, html: `<h2 class="rdh"><small>Chương ${i + 1}</small>${esc(c.t)}</h2>${c.p.map(x => `<p>${esc(x)}</p>`).join('')}` }));
}
function openReader(bookId, mode) {
  const b = S.books[bookId]; if (!b) return;
  const pf = learnSet().reader || {};
  RD = { id: bookId, t0: Date.now(), mode: mode || (b.builtin ? 'lib' : b.fileId ? (/pdf/i.test(b.fileType || '') ? 'pdf' : 'txt') : 'sum'), ch: Number(b.readCh) || 0, frac: Number(b.readFrac) || 0, page: 0, pages: 1, size: pf.size || 18, theme: pf.theme || 'light', lang: pf.lang || 'both', font: pf.font || 'serif', lh: pf.lh || 1.7, ui: true, panel: '' };
  let el = document.getElementById('reader'); if (!el) { el = document.createElement('div'); el.id = 'reader'; document.body.appendChild(el); rdBind(el); }
  document.body.style.overflow = 'hidden';
  if (b.fileId && /pdf/i.test(b.fileType || '')) { RD.pdfUrl = ''; fileURL(b.fileId).then(u => { if (RD) { RD.pdfUrl = u; if (RD.mode === 'pdf') drawReader(); } }); }
  if (RD.mode === 'txt') { RD.txtCh = null; fileURL(b.fileId).then(u => fetch(u)).then(r => r.ok ? r.text() : Promise.reject()).then(tx => { const ps = tx.replace(/\r/g, '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean), out = []; for (let i = 0; i < ps.length; i += 40) out.push({ t: 'Phần ' + (out.length + 1), html: ps.slice(i, i + 40).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('') }); RD.txtCh = out.length ? out : [{ t: 'Trống', html: '<p>Tệp trống.</p>' }]; drawReader(true); }).catch(() => { RD.txtCh = [{ t: 'Lỗi', html: '<p>Không tải được tệp. Kiểm tra kết nối rồi thử lại.</p>' }]; drawReader(); }); }
  drawReader(true);
}
function drawReader(restore) {
  const el = document.getElementById('reader'), b = RD && S.books[RD.id]; if (!el || !b) return;
  const tabs = [b.builtin ? ['lib', '📖 Đọc'] : null, b.fileId ? [/pdf/i.test(b.fileType || '') ? 'pdf' : 'txt', '📎 Tệp sách'] : null, sumOf(b.title) || b.takeaways ? ['sum', '📝 Tóm tắt'] : null].filter(Boolean);
  el.className = 'show th-' + RD.theme + (RD.ui ? ' ui' : '') + ' f-' + RD.font;
  if (RD.mode === 'pdf') {
    el.innerHTML = `<div class="rdbar"><button class="rdi" data-rd="close" aria-label="Đóng">✕</button><div class="rdt"><b>${esc(b.title)}</b><span>${esc(b.author || '')}</span></div>${tabs.length > 1 ? tabs.map(([k, l]) => `<button class="rdi txt ${RD.mode === k ? 'on' : ''}" data-rd="mode" data-k="${k}">${l}</button>`).join('') : ''}<a class="rdi txt" href="${RD.pdfUrl || '#'}" target="_blank" rel="noopener">↗</a></div><div class="rdpdf"><iframe src="${RD.pdfUrl || 'about:blank'}" title="${esc(b.title)}"></iframe></div>`;
    return;
  }

    case 'go-accounts': location.hash = '#tai-khoan'; break;
    case 'acc-new': accForm(); break;
    case 'acc-edit': accForm(id); break;
    case 'acc-quick': accQuick(); break;
    case 'cats-edit': catsForm(); break;
  }
});
let searchT = null;
document.addEventListener('input', e => {
  if (e.target.id === 'card-q') { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => { UI.cardQ = v; render(); const el = document.getElementById('card-q'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 250); }
  if (e.target.id === 'note-q' || e.target.id === 'ct-q') { clearTimeout(searchT); const v = e.target.value, idq = e.target.id; searchT = setTimeout(() => { if (idq === 'note-q') UI.noteQ = v; else UI.ctQ = v; render(); const el = document.getElementById(idq); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 250); }
  if (e.target.id === 'per-from' || e.target.id === 'per-to') { if (e.target.value) { UI.per[e.target.id === 'per-from' ? 'from' : 'to'] = e.target.value; render(); } }
  if (e.target.id === 'asof' && e.target.value) { UI.asOf = e.target.value; render(); }
  if (e.target.id === 'tx-cat-sel') { UI.txCat = e.target.value; render(); }
  if (e.target.id === 'tx-acc-sel') { UI.txAcc = e.target.value; render(); }
  if (e.target.id === 'ac-bigtx' && AUTH.L) { AUTH.L.bigTx = Number(e.target.value); saveL(); toast(AUTH.L.bigTx ? 'Sẽ xác thực lại khi lưu / xoá giao dịch từ ' + fmt(AUTH.L.bigTx) : 'Không yêu cầu xác thực lại theo số tiền'); }
  if (e.target.id === 'ac-lock' && AUTH.L) { AUTH.L.lockMin = Number(e.target.value); saveL(); toast('Đã lưu: ' + e.target.selectedOptions[0].text.toLowerCase()); }
  if (e.target.matches && e.target.matches('[data-act="ac-pref"]')) acctAct('ac-pref', e.target);
  if (e.target.id === 'hist-acc') { histState().acc = e.target.value; histState().limit = 200; render(); }
  if (e.target.id === 'hist-q') { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => { histState().q = v; histState().limit = 200; render._focusSearch = true; render(); }, 250); }
  if (e.target.id === 'ct-g') { UI.ctGroup = e.target.value; render(); }
  if (e.target.id === 'card-deck') { UI.cardDeck = e.target.value; render(); }
  if (e.target.id === 'tx-search') { clearTimeout(searchT); const v = e.target.value; searchT = setTimeout(() => { UI.txSearch = v; render._focusSearch = true; render(); }, 250); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
let _day = today(); setInterval(() => { const d = today(); if (d !== _day) { _day = d; if (!document.getElementById('ov').classList.contains('show')) render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== _day) { _day = today(); render(); } });
init();
</script>
</body>
</html>
