<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Cá Nhân</title>
<meta name="description" content="Sổ cá nhân: tài chính, lịch âm dương, sức khỏe, học tập, kế hoạch – dùng được cả khi không có mạng.">
<meta name="theme-color" content="#1e2a5e">
<script>/* giao diện & ngôn ngữ đã chọn – áp dụng trước khi vẽ trang */try{var _t=localStorage.getItem('scn-theme')||'light',_d=_t==='dark'||(_t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=_d?'dark':'light';if(localStorage.getItem('scn-lang')==='en'){document.documentElement.lang='en';document.documentElement.classList.add('i18n-wait');setTimeout(function(){document.documentElement.classList.remove('i18n-wait')},3000)}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1.13.1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1.13.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Cá Nhân">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --card:#fcfcfb; --card2:#f0efea; --text:#0b0b0b; --text2:#52514e; --muted:#8a8984; --line:#e4e2dc;
  --accent:#2a78d6; --accent-ink:#fff;
  --inc:#2a78d6; --exp:#eb6834;
  --pos:#17803d; --neg:#c2410c; --warn:#a16207; --crit:#c62828;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media all{ /* giao diện tối: bật bằng <html data-theme="dark"> (Sáng / Tối / Theo máy – ⚙️ hoặc 👤) */
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#121211; --card:#1a1a19; --card2:#232321; --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86; --line:#2e2e2b;
    --accent:#3987e5; --inc:#3987e5; --exp:#d95926;
    --pos:#4cc27a; --neg:#f08a5d; --warn:#e0b341; --crit:#ef6b6b;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 160px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--text2);font-size:13px}
.muted{color:var(--muted);font-size:13px}
.banner{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text2);margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.stat .lbl{font-size:12px;color:var(--text2)}
.stat .val{font-size:17px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;word-break:break-word}
.hero .val{font-size:26px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .m{font-weight:600;min-width:110px;text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs a{flex:1;min-width:0;text-align:center;text-decoration:none;color:var(--muted);font-size:10.5px;white-space:nowrap;padding:4px 0;border-radius:8px}
nav.tabs a .ic{display:block;font-size:19px;line-height:1.2}
nav.tabs a.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:21}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .ic{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;text-align:right}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:10px 2px 4px;border-bottom:1px solid var(--line);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.chip.ok{color:var(--pos);border-color:currentColor}
.chip.due{color:var(--warn);border-color:currentColor}
.chip.late{color:var(--crit);border-color:currentColor}
.bar{height:8px;border-radius:999px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.catrow{margin:9px 0}
.catrow .row{font-size:13px;margin-bottom:4px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:transparent;padding:7px 4px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);display:none;z-index:5}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:8px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.amt-input{font-size:24px!important;font-weight:700;font-variant-numeric:tabular-nums}
.amt-input.chk{background:#fff6e0!important;border-color:#e0a800!important;box-shadow:0 0 0 2px rgba(224,168,0,.25)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{display:inline-flex}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;cursor:pointer;background:var(--bg)}
.cats input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.actions .spacer{flex:1}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;display:none;max-width:90vw;text-align:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.kv div:nth-child(odd){color:var(--text2)}
.kv div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sched .item{cursor:default}
.loading{text-align:center;padding:60px 10px;color:var(--text2)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* giai đoạn 2 */
.subnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.subnav a{flex:none;text-decoration:none;color:var(--text2);font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}
.subnav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0;font-weight:600}
.cal .d{min-height:50px;border-radius:9px;padding:4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;border:1px solid transparent;background:transparent}
.cal .d.out{opacity:.35}
.cal .d .n{font-size:14px;font-weight:600;line-height:1.2}
.cal .d .l{font-size:9px;color:var(--muted);line-height:1.2}
.cal .d .l.m1{color:var(--crit);font-weight:600}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{background:var(--accent);color:#fff}
.cal .d.sel .l{color:#fff}
.cal .d.sun .n{color:var(--crit)}
.cal .d.sel.sun .n{color:#fff}
.dots{display:flex;gap:2px;margin-top:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .d.sel .dots i{background:#fff}
.dots i.fin{background:var(--exp)}
.tm{font-size:12px;font-weight:600;color:var(--text2);min-width:42px}
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.todo .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:transparent;margin-top:1px}
.todo.done .ck{background:var(--pos);border-color:var(--pos)}
.todo.done .t1{text-decoration:line-through;color:var(--muted)}
.todo .main{flex:1;min-width:0;cursor:pointer}
.pri{font-size:11px;font-weight:700;margin-left:4px}
.secthead{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.moods{display:flex;gap:6px}
.moods label{flex:1}
.moods input{position:absolute;opacity:0;pointer-events:none}
.moods span{display:block;text-align:center;font-size:22px;padding:6px 0;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.moods input:checked+span{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 2px var(--accent) inset}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-grid button{padding:16px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:500}
.menu-grid button span{display:block;font-size:24px;margin-bottom:4px}
.steps label{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.steps input{width:18px;height:18px}
.hello{font-size:22px;font-weight:700;margin:0 0 2px}
.disc{font-size:11px;color:var(--muted);margin-top:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:8px 9px;cursor:pointer;background:var(--bg);min-width:0}
.tile .lbl{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile.ok .tk{background:var(--pos);border-color:var(--pos)}
.tile.ok .v{color:var(--pos)}
.hchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.hchip.on{background:var(--pos);border-color:var(--pos);color:#fff}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 6px;align-items:center;justify-items:center}
.hgrid .hd{font-size:10px;text-align:center;color:var(--muted);line-height:1.2}
.hgrid .hd.td{color:var(--accent);font-weight:700}
.hgrid .hn{grid-column:1/-1;justify-self:stretch;display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hc{width:100%;max-width:40px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;color:#fff;font-weight:700;font-size:14px;padding:0}
.hc.on{background:var(--pos);border-color:var(--pos)}
.hc.off{opacity:.35}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:2px;justify-content:start}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--card2);display:block}
.heat i.on{background:var(--pos)}
.heat i.off{background:transparent;border:1px dashed var(--line)}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg);min-width:0}
.mini .mt{font-size:12px;color:var(--text2);font-weight:600}
.mini .mv{font-size:17px;font-weight:700;margin:2px 0}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) auto 14px;gap:6px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.trow.click{cursor:pointer}
.trow .code{font-size:12px;font-weight:700;color:var(--text2)}
.trow .nm{min-width:0;word-break:break-word}
.trow .vv{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .chev{color:var(--muted);font-size:12px;text-align:center}
.trow .tsub{grid-column:2/-1;font-size:11.5px;color:var(--text2);line-height:1.4;margin-top:-4px}
.trow.d2 .tsub{padding-left:10px}.trow.d3 .tsub{padding-left:22px}.trow.d4 .tsub{padding-left:34px}
.trow.grp .nm,.trow.grp .vv{font-weight:700}
.trow.d0{background:var(--card2);border-radius:8px;border-bottom:none;margin-bottom:2px}
.trow.d0 .vv{font-size:15px}
.trow.d2 .nm{padding-left:10px}.trow.d3 .nm{padding-left:22px;font-size:13px}.trow.d4 .nm{padding-left:34px;font-size:13px}
.trow.d3 .vv,.trow.d4 .vv{font-size:13px;font-weight:400}
.tnote{font-size:11.5px;color:var(--text2);padding:6px 2px 8px 46px;border-bottom:1px solid var(--line)}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:12px;gap:2px;background:var(--card2)}
.stackbar i{display:block;height:100%}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#6250d6}
@media all{:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9}}
.click{cursor:pointer}
.hero2{border-radius:18px;padding:16px 16px 14px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#123d73 0%,#1c5cab 55%,#2a78d6 100%);box-shadow:0 6px 18px rgba(28,92,171,.25)}
.hero2 .hl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero2 .hv{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0;line-height:1.15;word-break:break-word}
.hero2 .hs{font-size:12px;opacity:.8}
.hero2 .asof{background:rgba(255,255,255,.15);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;display:flex;align-items:center;gap:2px}
.hero2 .asof input{background:transparent;border:none;color:#fff;font-size:12px;font-family:inherit;color-scheme:dark;width:118px}
.eq{display:flex;align-items:center;gap:6px;margin-top:14px}
.eq>div{flex:1;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.eq span{display:block;font-size:10.5px;opacity:.8}
.eq b{font-size:14px;white-space:nowrap}
.eq i{font-style:normal;font-weight:700;opacity:.7}
.dr{margin-top:12px;font-size:12px}
.drb{height:6px;border-radius:999px;background:rgba(255,255,255,.2);margin-top:5px;overflow:hidden}
.drb i{display:block;height:100%;background:#fff;border-radius:999px}
.dpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-bottom:12px}
.dpair>.card{margin:0}
.dwrap{display:flex;align-items:center;gap:14px}
.dleg{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.dleg>div{display:grid;grid-template-columns:10px minmax(0,1fr) auto 32px;gap:6px;align-items:center;font-size:13px}
.dleg i{width:10px;height:10px;border-radius:3px}
.dleg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
@media (max-width:360px){.dwrap{flex-direction:column}}
.sechd{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text2)}
.sechd b{font-size:15px;color:var(--text);letter-spacing:0}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.gh{display:flex;align-items:center;gap:12px;padding:12px 14px 8px}
.gic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.gt{flex:1;min-width:0}.gtt{font-weight:600;font-size:15px}
.gvv{text-align:right;display:flex;align-items:center;gap:8px}.gvv .num{font-weight:700;font-size:16px}
.gvv .chev{color:var(--muted);font-size:12px}
.bar.thin{height:4px}
.gcard:not(.open) .bar.thin{margin-bottom:12px!important}

/* ===== THEME: màu sắc & font theo mẫu (navy · xanh ngọc · be) ===== */
:root{color-scheme:light;
  --bg:#eef2f8;--card:#ffffff;--card2:#f4f6fb;--text:#1c2554;--text2:#56608a;--muted:#8d94b0;--line:#e9e3d6;
  --accent:#3552c8;--accent-ink:#fff;--inc:#3552c8;--exp:#c27a3e;--pos:#1f9254;--neg:#d0482a;--warn:#b7791f;--crit:#d0482a;
  --navy:#1e2a5e;--navy2:#2b3f7a;--teal:#4fc3b5;--teal2:#3a9f99;--gold:#c9a45c;--beige:#ece4d3;
  --s1:#3552c8;--s2:#c27a3e;--s3:#2fa58f;--s4:#c9a45c;--s5:#8a5cc7;--s6:#2b3f7a;
  --shadow:0 1px 2px rgba(30,42,94,.05),0 6px 20px rgba(30,42,94,.06)}
html,body{background:linear-gradient(180deg,#e9eef7 0,#f2f4f9 320px,#f4f5f8 100%);font-family:"Lexend",system-ui,sans-serif;letter-spacing:-.005em}
body{color:var(--text)}
.num,.val,.svp,.bsv,.gv,.hv{font-variant-numeric:tabular-nums lining-nums}
header.top h1{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--navy);display:flex;align-items:center;gap:10px}
header.top h1::before{content:'';width:5px;height:22px;border-radius:3px;background:var(--gold)}
header.top .sub{padding-left:15px;color:var(--text2)}
.card,.gcard,.svc{border:1px solid var(--beige);border-radius:18px;box-shadow:var(--shadow)}
.card h2{font-weight:700;color:var(--navy)}
.stat .val,.val{color:var(--navy);font-weight:700}
.btn{border-color:var(--beige);border-radius:12px;font-weight:600;color:var(--navy)}
.btn.primary{background:linear-gradient(135deg,var(--navy2),var(--accent));border-color:transparent;color:#fff}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn.ghost{color:var(--accent)}
.iconbtn{border-color:var(--beige)}
.chip{border-color:var(--beige)}
.subnav a{border-color:var(--beige);color:var(--navy2);font-weight:500;background:#fff}
.subnav a.on{background:linear-gradient(135deg,var(--navy),var(--accent));border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(53,82,200,.25)}
.seg{background:#e6eaf4}.seg button{color:var(--text2);font-weight:500}.seg button.on{background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff}
nav.tabs{background:linear-gradient(90deg,var(--navy) 0%,#264a7e 60%,#2f7d8a 100%);border-top:none;box-shadow:0 -4px 16px rgba(30,42,94,.18)}
nav.tabs a{color:rgba(255,255,255,.72)}
nav.tabs a.on{color:#fff;background:rgba(255,255,255,.16);font-weight:600}
.fab{background:linear-gradient(135deg,var(--teal2),var(--teal));box-shadow:0 6px 18px rgba(58,159,153,.45)}
.secthead,.sechd{color:var(--navy2)}
.sechd span:first-child{display:flex;align-items:center;gap:8px}
.sechd span:first-child::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--gold)}
.f input,.f select,.f textarea{border-color:var(--beige);background:#fbfaf7;color:var(--text)}
.sheet{background:#fff}.sheet h3{color:var(--navy);font-weight:700}
.bar{background:#ecebf3}.bar>i{background:var(--accent)}
.banner{background:#f6f2e8;border-color:var(--beige);color:var(--text2)}
.toast{background:var(--navy);color:#fff}
.pos{color:var(--pos)}.neg{color:var(--neg)}
/* Thẻ tổng (hero) */
.hero2,.svhero,.ashero{background:linear-gradient(120deg,#1b2557 0%,#243a72 45%,#2c6b86 80%,#3fa39b 100%);box-shadow:0 10px 26px rgba(27,37,87,.28);border-radius:22px}
.hero2 .hl,.svhero .hl{color:#bfeee7;letter-spacing:.12em}
.hero2 .hv,.svhero .hv{font-weight:800;letter-spacing:-.02em}
.svlive,.hero2 .asof{background:rgba(79,195,181,.22);color:#dffaf6}
.eq>div,.svk>div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
.svk b,.eq b{color:#fff}

// ================= TỔNG QUAN =================
function financeReminders() {
  const td = today(), rem = [];
  for (const id in S.loans) {
    const l = S.loans[id], st = loanStatus(l, id, S.txns, td);
    st.overdue.forEach(r => rem.push({ d: r.due, html: reminderLoan(id, l, r, true) }));
    if (st.next && st.next.due >= td && st.next.due <= addDays(td, 30)) rem.push({ d: st.next.due, html: reminderLoan(id, l, st.next, false) });
  }
  for (const id in S.savings) {
    const s = S.savings[id]; if (s.status === 'closed') continue; const m = savingMaturity(s);
    if (m <= addDays(td, 30)) rem.push({ d: m, html: `<div class="item" data-act="go-savings"><div class="ic">🐷</div><div class="main"><div class="t1">Đáo hạn: ${esc(s.name)}</div><div class="t2">${fmtDate(m)} · ${esc(s.bank || '')}</div></div><div class="amt num">${fmtShort(Number(s.principal) + savingInterest(s))}</div>${m < td ? '<span class="chip late">⚠ Quá hạn</span>' : ''}</div>` });
  }
  rem.sort((a, b) => a.d < b.d ? -1 : 1);
  return rem.map(r => r.html).join('');
}
function reminderLoan(id, l, r, late) {
  return `<div class="item" data-act="loan-open" data-id="${id}"><div class="ic">🏧</div><div class="main"><div class="t1">Trả nợ kỳ ${r.k}: ${esc(l.name)}</div><div class="t2">${fmtDate(r.due)} · gốc ${fmtShort(r.principal)} + lãi ${fmtShort(r.interest)}</div></div><div class="amt num">${fmtShort(r.total)}</div>${late ? '<span class="chip late">⚠ Quá hạn</span>' : ''}</div>`;
}
function showTip(el, evt) {
  const box = document.getElementById('chartbox'), tip = document.getElementById('tip'); if (!box || !tip) return;
  const [m, i, e] = el.dataset.tip.split('|');
  tip.innerHTML = `<b>${m}</b><br>Thu: ${i}<br>Chi: ${e}`;
  const br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
  let x = r.left + r.width / 2 - br.left; x = Math.max(70, Math.min(br.width - 70, x));
  tip.style.left = x + 'px'; tip.style.top = '40px'; tip.style.display = 'block';
}
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') { const t = document.getElementById('tip'); if (t) t.style.display = 'none'; } });

function txTitle(t) {
  const l = t.loanId && S.loans[t.loanId], s = t.savingId && S.savings[t.savingId];
  switch (t.type) {
    case 'income': case 'expense': return [ICONS[t.category] || '•', t.category || 'Khác'];
    case 'transfer': return ['🔁', 'Chuyển: ' + accName(t.accountId) + ' → ' + accName(t.toAccountId)];
    case 'loan_in': return ['🏧', 'Nhận tiền vay: ' + (l ? l.name : '')];
    case 'loan_pay': return ['🏧', (t.period > 0 ? 'Trả nợ kỳ ' + t.period : Number(t.principal) && Number(t.interest) ? 'Trả gốc + lãi' : Number(t.principal) ? 'Trả gốc' : 'Trả lãi') + ': ' + (l ? l.name : '')];
    case 'save_out': return ['🐷', 'Gửi tiết kiệm: ' + (s ? s.name : '')];
    case 'save_back': return ['🐷', 'Tất toán gốc: ' + (s ? s.name : '')];
    case 'asset_buy': return ['🏷️', 'Mua tài sản: ' + ((S.assets[t.assetId] || {}).name || '')];
    case 'asset_sell': return ['🏷️', 'Bán tài sản: ' + ((S.assets[t.assetId] || {}).name || '')];
  }
  return ['•', t.type];
}
function txSign(t) { return ['income', 'loan_in', 'save_back', 'asset_sell'].includes(t.type) ? 1 : ['expense', 'loan_pay', 'save_out', 'asset_buy'].includes(t.type) ? -1 : 0; }

  return `<div class="item" data-act="tx-edit" data-id="${id}"><div class="ic">${ic}</div><div class="main"><div class="t1">${esc(title)}</div><div class="t2">${sub}</div></div><div class="amt num ${sg > 0 ? 'pos' : sg < 0 ? 'neg' : ''}">${sg > 0 ? '+' : sg < 0 ? '−' : ''}${fmt(t.amount)}</div></div>`;

function confirmOver(msg, okText, noText) {

function tsDate(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function monthReport(ym) {
  const [y, m] = ym.split('-').map(Number), from = ym + '-01', to = ym + '-' + pad(new Date(y, m, 0).getDate()), tdy = today(), end = to < tdy ? to : tdy;
  const R = { ym, sec: [] }, add = (title, rows, hint) => R.sec.push({ title, rows, hint });
  // Tài chính
  const ms = monthStats(S.txns, ym), pv = monthStats(S.txns, shiftYM(ym, -1)), saveRate = ms.inc ? (ms.inc - ms.exp) / ms.inc : null;
  const top = Object.entries(ms.cat).sort((a, b) => b[1] - a[1]).slice(0, 3), bl = budgetLimits();
  const over = Object.entries(bl).filter(([c, l]) => (c === '__total' ? ms.exp : (ms.cat[c] || 0)) > l).map(([c]) => c === '__total' ? 'Tổng chi' : c);
  const dlt = (a, b) => b ? (a >= b ? '▲ ' : '▼ ') + Math.abs(Math.round((a - b) / b * 100)) + '% so với tháng trước' : '';
  add('💰 Tài chính', [['Thu nhập', fmt(ms.inc), dlt(ms.inc, pv.inc)], ['Chi tiêu', fmt(ms.exp), dlt(ms.exp, pv.exp)], ['Trả nợ gốc', fmt(ms.principal)], ['Dòng tiền ròng', fmt(ms.net)], ['Tỷ lệ tiết kiệm', saveRate != null ? Math.round(saveRate * 100) + '%' : '—', 'Thu trừ chi, chia cho thu. Nên ≥ 20%'], ['Chi nhiều nhất', top.map(([c, v]) => c + ' ' + fmtShort(v)).join(' · ') || '—'], ['Vượt ngân sách', over.length ? over.join(', ') : (Object.keys(bl).length ? 'Không ✓' : 'Chưa đặt ngân sách')]]);
  // Sức khỏe
  const H = Object.entries(S.health).map(([id, x]) => ({ ...x, date: x.date || id })).filter(x => x.date >= from && x.date <= to).sort((a, b) => a.date.localeCompare(b.date));
  const ws = H.filter(x => x.weight), bp = H.filter(x => x.sys && x.dia);
  add('❤️ Sức khỏe', [['Số ngày ghi chỉ số', H.length + ' ngày'], ['Cân nặng', ws.length ? nf1(ws[0].weight) + ' → ' + nf1(ws[ws.length - 1].weight) + ' kg' : '—', ws.length > 1 ? (ws[ws.length - 1].weight - ws[0].weight > 0 ? '+' : '') + nf1(ws[ws.length - 1].weight - ws[0].weight) + ' kg trong tháng' : ''], ['Huyết áp trung bình', bp.length ? Math.round(avgOf(bp.map(x => x.sys))) + '/' + Math.round(avgOf(bp.map(x => x.dia))) : '—'], ['Giấc ngủ TB', avgOf(H.map(x => x.sleep)) != null ? nf1(avgOf(H.map(x => x.sleep))) + ' giờ' : '—', 'Khuyến nghị 7–9 giờ'], ['Bước chân TB', avgOf(H.map(x => x.steps)) != null ? Math.round(avgOf(H.map(x => x.steps))).toLocaleString('vi-VN') : '—']]);
  // Học tập
  const st = Object.values(S.study).filter(x => x.date >= from && x.date <= to), mins = st.reduce((s, x) => s + (Number(x.minutes) || 0), 0), sd = new Set(st.map(x => x.date)).size;
  const newCards = Object.values(S.cards).filter(c => c.created && ymOf(tsDate(c.created)) === ym).length;
  add('📚 Học tập', [['Tổng thời gian', Math.floor(mins / 60) + ' giờ ' + mins % 60 + ' phút'], ['Số ngày có học', sd + ' ngày'], ['Thẻ từ mới', newCards + ' thẻ'], ['Lộ trình tiếng Anh', enState().start ? Object.values(enState().done || {}).filter(Boolean).length + '/12 tuần hoàn thành' : 'Chưa bắt đầu']]);
  // Thói quen
  const hl = habitList();
  add('🔁 Thói quen', hl.length ? hl.map(x => { const r = from <= end ? habitRate(x, from, end) : null; return [x.icon + ' ' + x.name, r != null ? Math.round(r * 100) + '%' : '—', 'Chuỗi hiện tại ' + habitStreak(x, tdy)]; }) : [['Chưa có thói quen', '—']]);
  // Kế hoạch
  const inM = ts => ts && ymOf(tsDate(ts)) === ym;

let HCH = null;
function hChart() {
  const td = today(), from = addDays(td, -UI.hRange + 1), L = healthList().filter(x => x.date >= from && x.date <= td).reverse();
  const k = UI.hMetric, series = k === 'bp'
    ? [{ name: 'Tâm thu', color: 'var(--inc)', key: 'sys' }, { name: 'Tâm trương', color: 'var(--exp)', key: 'dia' }]
    : [{ name: HMET[k][0], color: 'var(--inc)', key: k }];
  series.forEach(s => s.pts = L.filter(x => x[s.key] !== undefined && x[s.key] !== '' && x[s.key] != null).map(x => ({ d: x.date, v: Number(x[s.key]) })));

  if (!all.length) { HCH = null; return `<div class="empty">Chưa có dữ liệu ${HMET[k][0].toLowerCase()} trong khoảng này.</div>`; }

  if (k === 'steps' || k === 'sleep') lo = 0;
  const padv = (hi - lo) * 0.12 || Math.max(1, hi * 0.05); lo = k === 'steps' || k === 'sleep' ? 0 : lo - padv; hi += padv;
  const W = 340, H = 180, pl = 4, pr = 4, pt = 12, pb = 20, n = Math.max(1, daysBetween(from, td));

  const nf = v => k === 'steps' ? Math.round(v).toLocaleString('vi-VN') : (Math.round(v * 10) / 10).toLocaleString('vi-VN');
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" id="hsvg" style="touch-action:pan-y" role="img" aria-label="Biểu đồ ${HMET[k][0]}">`;
  [0, 0.5, 1].forEach(f => { const v = lo + (hi - lo) * f, y = Y(v); svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W - 2}" y="${y - 3}" text-anchor="end" font-size="9" fill="var(--muted)">${nf(v)}</text>`; });
  if (tw) svg += `<line x1="0" x2="${W}" y1="${Y(tw)}" y2="${Y(tw)}" stroke="var(--pos)" stroke-dasharray="4 4"/><text x="4" y="${Y(tw) - 3}" font-size="9" fill="var(--pos)">Mục tiêu ${tw}</text>`;
  if (k === 'bp') [[120, 'var(--muted)'], [80, 'var(--muted)']].forEach(([v]) => { if (v > lo && v < hi) svg += `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--muted)" stroke-dasharray="2 4" opacity=".6"/>`; });
  svg += `<text x="2" y="${H - 5}" font-size="9" fill="var(--muted)">${fmtDate(from).slice(0, 5)}</text><text x="${W - 2}" y="${H - 5}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtDate(td).slice(0, 5)}</text>`;
  series.forEach(s => {
    if (s.pts.length > 1) svg += `<path d="${s.pts.map((p, i) => (i ? 'L' : 'M') + X(p.d).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.pts.length <= 45) s.pts.forEach(p => svg += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="3.5" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`);

function bindHChart() {
  const svg = document.getElementById('hsvg'); if (!svg || !HCH) return;
  const tip = document.getElementById('htip'), xl = document.getElementById('hx'), box = document.getElementById('hbox');
  const move = e => {

    const bw = box.getBoundingClientRect().width; tip.style.left = Math.max(70, Math.min(bw - 70, x / HCH.W * bw)) + 'px'; tip.style.top = '4px'; tip.style.transform = 'translate(-50%,0)'; tip.style.display = 'block';

  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);

}

  let h = `<div class="svc calc ${op ? 'open' : ''}" id="an-${a.id}"><div class="svhd click" data-act="rep-tog" data-k="${k}"><div class="ash"><div class="ash-l nw"><span class="mono" style="background:${T[2]}">${T[1]}</span><span class="ash-n v"><b>${esc(a.title)}</b><em>${annivDateTxt(a)} · lần tới ${WDX[wdOf(nx.d)]} ${fmtDate(nx.d)}${nx.n != null ? ' · <b class="anl">' + esc(annivNLabel(a, nx.n)) + '</b>' : ''}${a.src === 'contact' ? ' · 👥 Danh bạ' : ''}</em></span></div><div class="ash-r">${dChip(nx.i)}<span class="svchev">${op ? '▴' : '▾'}</span></div></div></div>`;
  if (op) {
    const more = []; let from = addDays(nx.d, 1); for (let j = 0; j < 2; j++) { const q = annivNext(a, from); if (!q) break; more.push(q.d); from = addDays(q.d, 1); }
    h += `<div class="svbody"><div class="svkv"><div><span>Loại</span><b>${T[0]}</b></div><div><span>Ngày gốc</span><b>${annivDateTxt(a)}</b></div><div><span>Lần tới (dương)</span><b>${fmtDate(nx.d)}</b></div><div><span>Thứ</span><b>${WDN[wdOf(nx.d)]}</b></div><div><span>Âm lịch lần tới</span><b>${ld}/${lm} ${canChiYear(ly)}</b></div><div><span>Lần thứ</span><b>${esc(annivNLabel(a, nx.n) || '—')}</b></div><div><span>Nhắc</span><b>${remTxt(anRem(a))}</b></div><div><span>Người liên quan</span><b>${esc(a.person || '—')}</b></div>${a.place ? `<div><span>Địa điểm</span><b>${esc(a.place)}</b></div>` : ''}${a.note ? `<div><span>Ghi chú</span><b>${esc(a.note)}</b></div>` : ''}</div>
      ${more.length ? `<div class="rcpt"><div class="rh">Các năm tiếp theo</div>${more.map(d => `<div class="rl"><span>${WDN[wdOf(d)]}, ${fmtDate(d)}</span><b>ÂL ${lunarOf(d)[0]}/${lunarOf(d)[1]}</b></div>`).join('')}</div>` : ''}
      <div class="svact">${a.src === 'contact' ? '' : `<button class="btn sm danger" data-act="an-del" data-id="${a.id}">🗑 Xoá</button>`}<span class="spacer"></span>${['gio', 'wedding', 'engage', 'bday'].includes(a.type) ? `<button class="btn sm" data-act="an-hh" data-id="${a.id}" data-d="${nx.d}">💸 Ghi chi</button>` : ''}<button class="btn sm primary" data-act="an-edit" data-id="${a.id}">${a.src === 'contact' ? 'Sửa trong Danh bạ' : '✏️ Sửa'}</button></div></div>`;
  }
  return h + '</div>';
}
function viewAnnivs() {
  const td = today(), L = allAnnivs().map(a => ({ a, nx: annivNext(a, td) })).filter(x => x.nx).sort((p, q) => p.nx.i - q.nx.i);
  const G = [['gio', 'A', 'Ngày giỗ', '🕯️', '#6d4c8f', ['gio']], ['bday', 'B', 'Sinh nhật', '🎂', '#c27a3e', ['bday']], ['wed', 'C', 'Ngày cưới – ăn hỏi', '💍', '#c0392b', ['wedding', 'engage']], ['oth', 'D', 'Kỷ niệm khác', '🎉', '#2fa58f', ['anniv']]].map(([k, Lt, n, ic, tone, types]) => ({ k, L: Lt, n, ic, tone, it: L.filter(x => types.includes(x.a.type) || (k === 'oth' && !AN_TYPES[x.a.type])) }));
  const nx = L[0];
  let h = `<div class="svhero calhero"><div class="row between"><span class="hl">Ngày kỷ niệm gần nhất</span><span class="svlive">● ${L.length} ngày đang theo dõi</span></div><div class="hv" style="font-size:24px">${nx ? esc(nx.a.title) : 'Chưa có ngày kỷ niệm'}</div><div class="hs">${nx ? `${WDN[wdOf(nx.nx.d)]}, ${fmtDate(nx.nx.d)} · ÂL ${lunarOf(nx.nx.d)[0]}/${lunarOf(nx.nx.d)[1]} · ${dLeft(nx.nx.i).toLowerCase()}${nx.nx.n != null ? ' · ' + esc(annivNLabel(nx.a, nx.nx.n)) : ''}` : 'Thêm ngày giỗ, sinh nhật, ngày cưới, ăn hỏi… để được nhắc trước'}</div>
    <div class="svk">${G.map(g => `<div class="click" ${jumpAttr('ang' + g.k, 'an-g-' + g.k)}><span>${g.L}. ${g.n} ›</span><b>${g.it.length} ngày${g.it.length ? ' · gần nhất ' + g.it[0].nx.i + 'n' : ''}</b></div>`).join('')}</div></div>`;
  const op = isOpen('antbl');
  h += svSec('an-sum', '📊', 'Tổng hợp ngày kỷ niệm', L.length, `Trong 30 ngày tới: <b>${L.filter(x => x.nx.i <= 30).length}</b> ngày`, L.length ? (op ? 'Thu gọn ▴' : 'Xem bảng ▾') : '', L.length ? 'data-act="rep-tog" data-k="antbl"' : '', op, '#6d4c8f', 'ngày');
  if (op && L.length) {
    let k = 0;
    const rows = G.filter(g => g.it.length).map(g => `<tr class="grp click" ${jumpAttr('ang' + g.k, 'an-g-' + g.k)}><td class="c"><b>${g.L}</b></td><td class="stk"><b>${g.n}</b></td><td colspan="8" class="muted">${g.it.length} ngày</td></tr>` + g.it.map(x => { k++; const [a1, a2] = lunarOf(x.nx.d); return `<tr class="click" ${jumpAttr('ang' + g.k + ',an' + x.a.id, 'an-' + x.a.id)}><td class="c">${k}</td><td class="stk"><b>${esc(x.a.title)}</b></td><td>${(AN_TYPES[x.a.type] || AN_TYPES.anniv)[0]}</td><td>${annivDateTxt(x.a)}</td><td>${fmtDate(x.nx.d)}</td><td>${WDX[wdOf(x.nx.d)]}</td><td>${a1}/${a2}</td><td>${dLeft(x.nx.i)}</td><td>${esc(annivNLabel(x.a, x.nx.n) || '—')}</td><td>${remTxt(anRem(x.a))}</td></tr>`; }).join('')).join('');
    h += `<div class="card svsecbody"><div class="xtbl"><table class="svt9" style="min-width:1040px"><thead><tr><th class="c">STT</th><th class="stk">Tên</th><th>Loại</th><th>Ngày gốc</th><th>Lần tới</th><th>Thứ</th><th>Âm lịch</th><th>Còn</th><th>Lần thứ</th><th>Nhắc</th></tr></thead><tbody>${rows}</tbody></table></div><div class="disc">Ngày giỗ theo âm lịch tự đổi sang dương lịch mỗi năm. Tháng âm thiếu (29 ngày) thì giỗ ngày 30 được tính vào ngày 29. Sinh nhật trong Danh bạ được tự động đưa vào đây.</div></div>`;
  }
  const allOpen = G.filter(g => g.it.length).every(g => isOpen('ang' + g.k));
  h += svSec('an-det', '📒', 'Chi tiết ngày kỷ niệm', L.length, 'Giỗ · Sinh nhật · Cưới – hỏi · Kỷ niệm khác', L.length ? (allOpen ? 'Thu gọn ▴' : 'Mở tất cả ▾') : '', L.length ? 'data-act="grp-all" data-keys="' + G.filter(g => g.it.length).map(g => 'ang' + g.k).join(',') + '"' : '', false, '#6d4c8f', 'ngày');
  G.forEach(g => { if (!(('ang' + g.k) in UI.open)) UI.open['ang' + g.k] = true; });
  G.forEach(g => { if (!g.it.length) return; h += grpHead('an-g-' + g.k, 'ang' + g.k, g.L + '. ' + g.n, g.it.length + ' ngày', g.tone, g.ic); if (isOpen('ang' + g.k)) h += `<div class="asgk">${g.it.map(anCard).join('')}</div>`; });
  if (!L.length) h += `<div class="card"><div class="empty">Chưa có ngày kỷ niệm. Bấm <b>+</b> để thêm ngày giỗ (âm lịch), sinh nhật, ngày cưới, ăn hỏi…</div></div>`;
  h += `<div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="an-new">+ Thêm ngày kỷ niệm</button></div>`;
  return h;
}

function viewHolidays() {
  const td = today(), y = UI.holYear || Number(td.slice(0, 4)), L = yearHolidays(y);
  const G = [['off', 'A', 'Nghỉ lễ – Tết', '🎌', 'var(--crit)', x => x.off], ['lun', 'B', 'Lễ truyền thống (âm lịch)', '🏮', '#c9a45c', x => !x.off && x.cal === 'lunar'], ['sol', 'C', 'Ngày kỷ niệm – quốc tế', '📅', 'var(--accent)', x => !x.off && x.cal === 'solar']].map(([k, Lt, n, ic, tone, f]) => ({ k, L: Lt, n, ic, tone, it: L.filter(f) }));
  const nh = nextHoliday(td, false), tet = L.find(x => x.name.includes('Mùng 1'));
  let h = `<div class="svhero calhero"><div class="row between"><span class="hl">Ngày lễ tiếp theo</span><span class="svlive">● Năm ${y}</span></div><div class="hv" style="font-size:24px">${nh ? nh.ic + ' ' + esc(nh.name) : '—'}</div><div class="hs">${nh ? `${WDN[wdOf(nh.d)]}, ${fmtDate(nh.d)} · ÂL ${lunarOf(nh.d)[0]}/${lunarOf(nh.d)[1]} · ${dLeft(nh.i).toLowerCase()}` : ''}</div>
    <div class="svk"><div class="click" ${jumpAttr('holgoff', 'hol-g-off')}><span>A. Ngày nghỉ lễ – Tết ›</span><b>${G[0].it.length} ngày</b></div><div><span>Mùng 1 Tết ${tet ? canChiYear(lunarOf(tet.d)[2]) : ''}</span><b>${tet ? WDX[wdOf(tet.d)] + ' ' + fmtDate(tet.d) : '—'}</b></div><div class="click" ${jumpAttr('holglun', 'hol-g-lun')}><span>B. Lễ âm lịch ›</span><b>${G[1].it.length} ngày</b></div><div class="click" ${jumpAttr('holgsol', 'hol-g-sol')}><span>C. Kỷ niệm – quốc tế ›</span><b>${G[2].it.length} ngày</b></div></div></div>`;
  h += `<div class="card pbar"><div class="row between"><button class="iconbtn" data-act="hol-y" data-k="-1" aria-label="Năm trước">‹</button><div style="text-align:center"><b>Năm ${y}</b><div class="muted">Âm lịch: ${canChiYear(y - 1)} → ${canChiYear(y)}</div></div><button class="iconbtn" data-act="hol-y" data-k="1" aria-label="Năm sau">›</button></div></div>`;
  const op = isOpen('holtbl');
  h += svSec('hol-sum', '📊', 'Tổng hợp ngày lễ', L.length, `Nghỉ lễ: <b>${G[0].it.length}</b> ngày theo lịch · âm lịch ${G[1].it.length} · kỷ niệm ${G[2].it.length}`, op ? 'Thu gọn ▴' : 'Xem bảng ▾', 'data-act="rep-tog" data-k="holtbl"', op, 'var(--crit)', 'ngày');
  if (op) {
    let k = 0;
    const rows = G.filter(g => g.it.length).map(g => `<tr class="grp click" ${jumpAttr('holg' + g.k, 'hol-g-' + g.k)}><td class="c"><b>${g.L}</b></td><td class="stk"><b>${g.n}</b></td><td colspan="5" class="muted">${g.it.length} ngày</td></tr>` + g.it.map(x => { k++; const i = daysBetween(td, x.d), [a1, a2] = lunarOf(x.d); return `<tr class="${i < 0 ? 'past' : ''}"><td class="c">${k}</td><td class="stk"><b>${x.ic} ${esc(x.name)}</b></td><td>${fmtDate(x.d)}</td><td>${WDX[wdOf(x.d)]}</td><td>${a1}/${a2}</td><td class="c">${x.off ? '<b class="neg">Nghỉ</b>' : '—'}</td><td>${i < 0 ? 'Đã qua' : dLeft(i)}</td></tr>`; }).join('')).join('');
    h += `<div class="card svsecbody"><div class="xtbl"><table class="svt9" style="min-width:760px"><thead><tr><th class="c">STT</th><th class="stk">Ngày lễ</th><th>Dương lịch</th><th>Thứ</th><th>Âm lịch</th><th class="c">Nghỉ</th><th>Còn</th></tr></thead><tbody>${rows}</tbody></table></div><div class="disc">Theo Bộ luật Lao động 2019: nghỉ Tết Dương lịch 1 ngày, Tết Âm lịch 5 ngày, Giỗ Tổ 1 ngày, 30/4 và 1/5 mỗi ngày 1 ngày, Quốc khánh 2 ngày (2/9 và 1 ngày liền kề). Ngày nghỉ Tết, nghỉ bù và hoán đổi cụ thể theo thông báo của Chính phủ từng năm.</div></div>`;
  }
  h += svSec('hol-det', '📒', 'Chi tiết ngày lễ', L.length, 'Nghỉ lễ – Tết · Lễ âm lịch · Kỷ niệm – quốc tế', G.every(g => isOpen('holg' + g.k)) ? 'Thu gọn ▴' : 'Mở tất cả ▾', 'data-act="grp-all" data-keys="holgoff,holglun,holgsol"', false, 'var(--crit)', 'ngày');
  G.forEach(g => {
    if (!g.it.length) return; h += grpHead('hol-g-' + g.k, 'holg' + g.k, g.L + '. ' + g.n, g.it.length + ' ngày', g.tone, g.ic);
    if (isOpen('holg' + g.k)) h += `<div class="asgk">${g.it.map(x => { const i = daysBetween(td, x.d); return `<div class="svc calc ${i < 0 ? 'past' : ''} click" data-act="cal-goto" data-d="${x.d}"><div class="ash"><div class="ash-l nw">${dBadge(x.d, x.off ? 'var(--crit)' : g.tone)}<span class="ash-n v"><b>${x.ic} ${esc(x.name)}</b><em>${WDN[wdOf(x.d)]} · ${lunarFull(x.d)}</em></span></div><div class="ash-r">${i < 0 ? '<span class="chip">Đã qua</span>' : dChip(i)}${x.off ? '<span class="ash-g neg"><b>Nghỉ</b></span>' : ''}</div></div></div>`; }).join('')}</div>`;
  });
  return h;
}

function todoList() { return Object.entries(S.todos).map(([id, t]) => ({ id, ...t })); }

  const sub = [t.due ? (late ? '⚠ Quá hạn ' : '📅 ') + fmtDate(t.due) : '', g ? '🎯 ' + g.title : '', t.note].filter(Boolean).map(esc).join(' · ');

}

function viewTodos() {

  const groups = [['⚠ Quá hạn', open.filter(t => t.due && t.due < td)], ['Hôm nay', open.filter(t => t.due === td)], ['7 ngày tới', open.filter(t => t.due > td && t.due <= addDays(td, 7))], ['Sau này', open.filter(t => t.due > addDays(td, 7))], ['Không có hạn', open.filter(t => !t.due)]];

  const card = g => {
    const p = goalProgress(g), a = AREAS[g.area] || AREAS.personal, left = g.deadline ? daysBetween(today(), g.deadline) : null;

function viewStudyLog() {
  const td = today(), goal = Number((S.settings.main || {}).studyGoal) || 30, days = []; for (let i = 13; i >= 0; i--) days.push(addDays(td, -i));
  const per = {}; Object.values(S.study).forEach(x => { per[x.date] = (per[x.date] || 0) + (Number(x.minutes) || 0); });
  const mx = Math.max(goal, ...days.map(d => per[d] || 0)), hit = days.slice(-7).filter(d => (per[d] || 0) >= goal).length, w7 = days.slice(-7).reduce((s, d) => s + (per[d] || 0), 0);
  let h = `<div class="svhero lrhero"><div class="row between"><span class="hl">Nhật ký học</span><span class="svlive">● Mục tiêu ${goal} phút/ngày</span></div><div class="hv">${hmTxt(w7)} / 7 ngày</div><div class="hs">Đạt mục tiêu ${hit}/7 ngày · xếp loại <b>${grade(hit / 7)[0]}</b> · chuỗi 🔥 ${streakDays(studyDays(), td)} ngày</div>
    <div class="svk"><div><span>Hôm nay</span><b>${hmTxt(per[td] || 0)}</b></div><div><span>TB / ngày (7n)</span><b>${hmTxt(Math.round(w7 / 7))}</b></div><div><span>Tháng này</span><b>${hmTxt(studyMins('', td.slice(0, 7) + '-01', td))}</b></div><div class="click" data-act="study-goal"><span>Mục tiêu / ngày ›</span><b>${goal} phút</b></div></div></div>`;
  h += `<div class="card"><h2>14 ngày gần nhất</h2><div style="display:flex;align-items:flex-end;gap:4px;height:130px;position:relative;border-bottom:1px solid var(--line)"><div style="position:absolute;left:0;right:0;bottom:${goal / mx * 110}px;border-top:1px dashed var(--pos)"></div>${days.map(d => { const v = per[d] || 0; return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%" title="${fmtDate(d)}: ${v} phút"><span class="muted" style="font-size:9px">${v || ''}</span><div style="width:70%;max-width:22px;height:${v / mx * 110}px;background:${v >= goal ? '#2fa58f' : '#3552c8'};border-radius:4px 4px 0 0"></div></div>`; }).join('')}</div><div style="display:flex;gap:4px">${days.map(d => `<div style="flex:1;text-align:center;font-size:10px;color:${d === td ? 'var(--text)' : 'var(--muted)'};font-weight:${d === td ? 700 : 400}">${WDX[wdOf(d)]}<br>${d.slice(8)}</div>`).join('')}</div><div class="muted" style="margin-top:6px">Cột xanh ngọc: đạt mục tiêu · nét đứt: ${goal} phút/ngày</div></div>`;
  const L = Object.entries(S.study).map(([id, x]) => ({ id, ...x })).sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0)).slice(0, 60);
  const op = isOpen('sltbl'); if (!('sltbl' in UI.open)) UI.open.sltbl = true;
  h += svSec('sl-sum', '📒', 'Chi tiết buổi học', L.length, 'Ghi lại mọi buổi học để theo dõi thời gian đầu tư cho bản thân', isOpen('sltbl') ? 'Thu gọn ▴' : 'Xem ▾', 'data-act="rep-tog" data-k="sltbl"', isOpen('sltbl'), '#3552c8', 'buổi');
  if (isOpen('sltbl')) h += L.length ? `<div class="card svsecbody"><div class="xtbl"><table class="svt9" style="min-width:760px"><thead><tr><th class="c">STT</th><th class="stk">Ngày</th><th>Loại</th><th>Kỹ năng</th><th class="n">Thời gian</th><th>Ghi chú</th></tr></thead><tbody>${L.map((x, i) => { const C = LEARN_CATS[catOfStudy(x)]; return `<tr class="click" data-act="study-edit" data-id="${x.id}"><td class="c">${i + 1}</td><td class="stk"><b>${fmtDate(x.date)}</b></td><td>${C[1]} ${esc(C[0].split(' (')[0])}</td><td>${x.skill ? SKILLS[x.skill] || '' : '—'}</td><td class="n">${hmTxt(Number(x.minutes) || 0)}</td><td>${esc(x.note || '')}</td></tr>`; }).join('')}</tbody></table></div></div>` : `<div class="card svsecbody"><div class="empty">Chưa có buổi học nào. Bấm <b>+</b> để ghi.</div></div>`;
  return h;
}

    const tg = () => sh.querySelector('#sd-skb').style.display = sh.querySelector('#sd-s').value === 'en' ? '' : 'none'; sh.querySelector('#sd-s').addEventListener('change', tg); tg();

      closeModal(); toast('Đã ghi.');
    })(); });
    if (id) sh.querySelector('#sd-del').onclick = async () => { if (await confirmDlg('Xoá buổi học này?')) { await del('study', id).catch(() => { }); closeModal(); toast('Đã xoá.'); } };
  });
}
function numPrompt(title, label, val, save) {
  openModal(`<h3>${title}<button class="iconbtn" data-x>✕</button></h3><form id="npf"><div class="f"><label>${label}</label><input id="np-v" type="number" min="0" value="${val}"></div><div class="actions"><button type="button" class="btn" data-x>Huỷ</button><button class="btn primary" id="np-s">Lưu</button></div></form>`, sh => {
    sh.querySelectorAll('[data-x]').forEach(b => b.onclick = closeModal);
    sh.querySelector('#npf').addEventListener('submit', e => { e.preventDefault(); busy(sh.querySelector('#np-s'), async () => { await save(Math.max(0, Math.round(Number(sh.querySelector('#np-v').value) || 0))); closeModal(); toast('Đã lưu.'); })(); });
  });
}

  'Cha giàu cha nghèo': ['Phân biệt tài sản (đưa tiền vào túi) và tiêu sản (lấy tiền ra khỏi túi).', 'Hiểu biết tài chính quan trọng hơn mức lương.', 'Để tiền làm việc cho mình thay vì chỉ làm việc vì tiền.', 'Xây dựng dòng thu nhập thụ động theo thời gian.', 'Học hỏi liên tục và dám hành động có tính toán.'],
  'Từ tốt đến vĩ đại': ['Lãnh đạo "cấp độ 5": khiêm tốn nhưng ý chí rất mạnh.', 'Chọn đúng người trước, rồi mới quyết định đi đâu.', 'Đối diện sự thật phũ phàng nhưng không mất niềm tin.', 'Khái niệm "con nhím": làm điều mình giỏi nhất, có đam mê và tạo ra giá trị kinh tế.', 'Văn hóa kỷ luật và hiệu ứng bánh đà – tiến bộ đến từ tích lũy bền bỉ.'],
  'Tư duy nhanh và chậm': ['Hệ thống 1 nhanh, trực giác; Hệ thống 2 chậm, phân tích.', 'Con người dễ mắc thiên kiến: neo giá, sẵn có, tự tin thái quá.', 'Nỗi đau khi mất thường lớn hơn niềm vui khi được cùng một lượng.', 'Cách trình bày vấn đề (framing) ảnh hưởng mạnh tới lựa chọn.', 'Với quyết định quan trọng: chậm lại, dùng dữ liệu và góc nhìn bên ngoài.'],
  'Sapiens: Lược sử loài người': ['Cách mạng nhận thức: khả năng tin vào "câu chuyện chung" giúp con người hợp tác quy mô lớn.', 'Cách mạng nông nghiệp thay đổi lối sống và xã hội loài người.', 'Tiền, đế chế và tôn giáo là những trật tự giúp thống nhất nhân loại.', 'Cách mạng khoa học bắt đầu từ việc thừa nhận "mình chưa biết".', 'Đặt câu hỏi về hạnh phúc và tương lai của loài người.'],
  'Nhà giả kim': ['Mỗi người có một "huyền thoại cá nhân" – ước mơ đáng theo đuổi.', 'Khi bạn thật sự mong muốn, mọi thứ sẽ hỗ trợ bạn.', 'Hành trình và những bài học trên đường quan trọng không kém đích đến.', 'Nỗi sợ thất bại là trở ngại lớn nhất.', 'Hãy lắng nghe trái tim và chú ý những dấu hiệu.'],
  'PMBOK Guide': ['Bộ tiêu chuẩn quản lý dự án của PMI – nền tảng cho chứng chỉ PMP.', 'Các nguyên tắc: tạo giá trị, quản lý bên liên quan, thích ứng, quản lý rủi ro…', 'Các lĩnh vực hiệu suất: phạm vi, tiến độ, chi phí, chất lượng, nguồn lực, truyền thông, rủi ro.', 'Kết hợp phương pháp dự đoán (truyền thống) và linh hoạt (agile).', 'Nên đọc kèm sách luyện thi và tình huống thực tế khi học PMP.'],
  'Đời ngắn đừng ngủ dài': ['Thức dậy sớm và có thời gian riêng cho bản thân mỗi sáng.', 'Làm việc mình sợ – vùng an toàn là nơi ước mơ dừng lại.', 'Tập trung vào điều quan trọng, nói "không" với điều vụn vặt.', 'Biết ơn và sống tử tế mỗi ngày.', 'Đầu tư cho bản thân: đọc sách, học hỏi, rèn luyện sức khỏe.']

// ---- Thư viện mở rộng (nội dung do Claude kể lại / tự biên soạn, không sao chép sách có bản quyền) ----
Object.assign(LIB, {
  cotich: { title: 'Truyện cổ tích Việt Nam chọn lọc', author: 'Dân gian Việt Nam (kể lại)', genre: 'folk', level: 'Mọi lứa tuổi', ch: [
    { t: 'Con Rồng cháu Tiên', p: ['Ngày xưa, ở vùng đất Lạc Việt có vị thần mình rồng tên là Lạc Long Quân, con trai thần Long Nữ, thường sống dưới nước, sức khỏe vô địch. Thần giúp dân diệt trừ yêu quái, dạy dân trồng trọt, chăn nuôi và cách ăn ở.', 'Ở vùng núi cao phương Bắc có nàng Âu Cơ thuộc dòng họ Thần Nông, xinh đẹp tuyệt trần. Nghe tiếng vùng đất Lạc Việt có nhiều hoa thơm cỏ lạ, nàng tìm đến thăm. Hai người gặp nhau, đem lòng yêu thương rồi nên duyên vợ chồng.', 'Ít lâu sau, Âu Cơ có mang và sinh ra một cái bọc trăm trứng; trăm trứng nở ra trăm người con khôi ngô, khỏe mạnh như thần.', 'Vì Lạc Long Quân quen sống dưới nước, còn Âu Cơ quen sống trên cạn, hai người đành chia con: năm mươi con theo cha xuống biển, năm mươi con theo mẹ lên núi, dặn nhau khi có việc thì giúp đỡ lẫn nhau.', 'Người con trưởng theo mẹ được tôn lên làm vua, lấy hiệu là Hùng Vương, đặt tên nước là Văn Lang. Vì thế người Việt tự hào mình là "con Rồng cháu Tiên" và gọi nhau thân thiết là "đồng bào" – cùng chung một bọc.'] },
    { t: 'Thánh Gióng', p: ['Đời Hùng Vương thứ sáu, ở làng Gióng có hai vợ chồng già hiền lành mà mãi không có con. Một hôm bà ra đồng ướm chân vào một vết chân rất to, về nhà thì có mang và sinh ra một cậu bé. Lạ thay, cậu lên ba vẫn không biết nói, biết cười, đặt đâu nằm đấy.', 'Bấy giờ giặc Ân kéo đến xâm lược. Nhà vua sai sứ giả đi khắp nơi tìm người tài cứu nước. Nghe tiếng sứ giả, cậu bé bỗng cất tiếng nói: "Mẹ ra mời sứ giả vào đây." Cậu xin vua rèn cho ngựa sắt, roi sắt, áo giáp sắt để đi đánh giặc.', 'Từ hôm đó, Gióng lớn nhanh như thổi, cơm ăn mấy cũng không no, áo vừa mặc xong đã chật. Bà con trong làng vui lòng góp gạo nuôi cậu, ai cũng mong cậu đánh thắng giặc.', 'Khi ngựa sắt, roi sắt được mang tới, Gióng vươn vai thành tráng sĩ, nhảy lên ngựa phi thẳng ra trận. Roi sắt gãy, Gióng nhổ những bụi tre bên đường quật vào giặc, giặc tan vỡ.', 'Đánh tan giặc, Gióng phi ngựa lên đỉnh núi Sóc, cởi áo giáp để lại rồi cả người lẫn ngựa bay về trời. Nhân dân lập đền thờ và tôn ông là Phù Đổng Thiên Vương.'] },
    { t: 'Sơn Tinh – Thủy Tinh', p: ['Vua Hùng thứ mười tám có người con gái tên Mỵ Nương, người đẹp như hoa, tính nết hiền dịu. Vua muốn kén cho con một người chồng thật xứng đáng.', 'Có hai chàng trai đến cầu hôn: Sơn Tinh – chúa vùng non cao, vẫy tay về phía đông thì phía đông nổi cồn bãi; và Thủy Tinh – chúa vùng nước thẳm, gọi gió gió đến, hô mưa mưa về. Cả hai đều tài giỏi như nhau.', 'Vua ra điều kiện: ai mang sính lễ gồm voi chín ngà, gà chín cựa, ngựa chín hồng mao đến trước thì được rước Mỵ Nương. Sáng hôm sau Sơn Tinh đến trước và đón được vợ về núi.', 'Thủy Tinh đến sau, nổi giận, dâng nước đánh Sơn Tinh. Nước ngập ruộng đồng, nhà cửa. Sơn Tinh bốc từng quả đồi, dời từng dãy núi chặn dòng nước; nước dâng bao nhiêu, đồi núi cao lên bấy nhiêu.', 'Cuối cùng Thủy Tinh đuối sức phải rút quân. Nhưng năm nào Thủy Tinh cũng dâng nước đánh Sơn Tinh – người xưa giải thích hiện tượng lũ lụt hằng năm và ý chí chế ngự thiên tai của người Việt.'] },
    { t: 'Cây khế', p: ['Ngày xưa có hai anh em mồ côi. Khi chia gia tài, người anh tham lam lấy hết nhà cửa, ruộng vườn, chỉ để cho em một túp lều nhỏ và một cây khế.', 'Người em chăm chỉ chăm sóc cây khế. Đến mùa, cây sai trĩu quả. Một hôm có con chim lạ đến ăn khế, người em buồn rầu than thở. Chim bảo: "Ăn một quả, trả cục vàng, may túi ba gang, mang đi mà đựng."', 'Người em may túi đúng ba gang, theo chim bay ra đảo xa, chỉ lấy vàng vừa đủ đầy túi rồi về. Từ đó cuộc sống của người em sung túc, lại hay giúp đỡ bà con nghèo.', 'Người anh biết chuyện liền đổi cả gia tài lấy cây khế. Khi chim đến, anh may túi to mười hai gang. Ra đảo, anh tham lam nhét vàng đầy túi, giắt thêm khắp người.', 'Trên đường về, chim không chịu nổi sức nặng, nghiêng cánh; người anh cùng túi vàng rơi xuống biển. Truyện khuyên con người sống lương thiện, biết đủ, tránh lòng tham.'] },
    { t: 'Sự tích trầu cau', p: ['Ngày xưa có hai anh em họ Cao giống nhau như đúc, thương yêu nhau hết mực. Cha mẹ mất, hai anh em theo học một thầy đồ họ Lưu.', 'Thầy có cô con gái xinh đẹp, nết na. Cô đem lòng yêu người anh; hai người thành vợ chồng. Từ đó người anh không còn quấn quýt với em như trước, người em buồn bã bỏ nhà ra đi.', 'Đi mãi đến bên bờ suối, người em mệt lả, ngồi khóc rồi hóa thành tảng đá vôi. Người anh đi tìm em, đến bên tảng đá thì kiệt sức, hóa thành cây cau mọc cạnh đó.', 'Người vợ đi tìm chồng, đến nơi tựa vào cây cau mà khóc, rồi hóa thành dây trầu quấn quanh thân cau.', 'Về sau, người ta thấy lá trầu, quả cau nhai cùng vôi thì thắm đỏ, thơm cay. Từ đó tục ăn trầu ra đời – "miếng trầu là đầu câu chuyện", tượng trưng cho tình anh em, nghĩa vợ chồng.'] },
    { t: 'Sự tích dưa hấu', p: ['Thời vua Hùng, có người con nuôi tên Mai An Tiêm thông minh, giỏi giang, được vua thương yêu. Một lần An Tiêm nói: "Của biếu là của lo, của cho là của nợ" – ý rằng mọi thứ đều do sức lao động mà có.', 'Có kẻ xấu tâu lại, vua cho là An Tiêm kiêu ngạo, bèn đày cả gia đình ra một hòn đảo hoang ngoài biển.', 'Trên đảo, An Tiêm không nản lòng. Một hôm thấy đàn chim ăn một loại quả lạ, chàng nhặt hạt đem gieo. Cây lớn lên cho quả vỏ xanh, ruột đỏ, ngọt mát.', 'An Tiêm khắc tên mình lên quả rồi thả xuống biển. Thuyền buôn vớt được, tìm ra đảo đổi hàng. Gia đình chàng dần trở nên khá giả.', 'Vua biết chuyện, hiểu ra và cho đón An Tiêm về. Giống dưa hấu được truyền khắp nơi – câu chuyện ca ngợi tinh thần tự lực, lao động sáng tạo.'] }
  ] },
  binhphap: { title: 'Binh pháp Tôn Tử – Tóm lược & áp dụng trong quản lý', author: 'Tôn Vũ (tóm lược, liên hệ thực tế)', genre: 'lead', level: 'Người đi làm', ch: [
    { t: 'Thủy kế – Lập kế hoạch trước khi hành động', p: ['Tôn Tử mở đầu bằng việc so sánh năm yếu tố: Đạo (sự đồng lòng), Thiên (thời cơ), Địa (địa thế), Tướng (người dẫn dắt) và Pháp (tổ chức, kỷ luật). Bên nào hơn ở nhiều yếu tố thì khả năng thắng cao hơn.', 'Áp dụng trong dự án: trước khi nhận thầu hay khởi công, hãy đánh giá: đội ngũ có đồng lòng không, thời điểm có thuận lợi không, mặt bằng – điều kiện thi công ra sao, người chỉ huy có đủ năng lực không, quy trình – hợp đồng đã chặt chẽ chưa.', 'Ý chính: tính toán kỹ thì nhiều phần thắng; tính toán sơ sài thì ít phần thắng; không tính toán thì sao có thể thắng.'] },
    { t: 'Tác chiến – Chi phí và tốc độ', p: ['Chiến tranh kéo dài làm hao người, tốn của. Tôn Tử đề cao việc tác chiến nhanh gọn, tận dụng nguồn lực tại chỗ.', 'Trong xây dựng, dự án kéo dài làm phát sinh chi phí quản lý, trượt giá, lãi vay. Một tiến độ hợp lý, có dự phòng nhưng không dàn trải, chính là cách tiết kiệm lớn nhất.', 'Hãy theo dõi dòng tiền theo từng mốc tiến độ và xử lý vướng mắc sớm – mỗi ngày chậm trễ đều có giá.'] },
    { t: 'Mưu công – Thắng mà không cần đánh', p: ['Bậc giỏi nhất là thắng mà không phải giao tranh: phá mưu đồ của đối phương, giữ được nguyên vẹn lực lượng.', 'Trong đàm phán hợp đồng hay giải quyết tranh chấp, cách tốt nhất thường là thương lượng sớm, đưa ra phương án đôi bên cùng có lợi, thay vì kéo nhau ra trọng tài hay tòa án.', 'Câu nổi tiếng: "Biết người biết ta, trăm trận không nguy." Hãy hiểu rõ năng lực của mình và nhu cầu thật của đối tác trước mỗi cuộc đàm phán.'] },
    { t: 'Quân hình & Binh thế – Tạo thế trước', p: ['Người giỏi trước hết làm cho mình không thể bị đánh bại, rồi chờ thời cơ đánh bại đối phương.', 'Áp dụng: hồ sơ pháp lý đầy đủ, biên bản nghiệm thu rõ ràng, nhật ký công trường chặt chẽ chính là "thế không thể bại" khi xảy ra tranh chấp hay thanh tra.', '"Thế" như nước đổ từ trên cao xuống: khi đã chuẩn bị đủ, chỉ cần một tác động nhỏ cũng tạo ra kết quả lớn.'] },
    { t: 'Hư thực – Tập trung vào điểm then chốt', p: ['Tránh chỗ mạnh, đánh vào chỗ yếu; tập trung lực lượng vào điểm quyết định thay vì dàn trải.', 'Trong quản lý: xác định đường găng (critical path) và các hạng mục rủi ro cao để tập trung nguồn lực; không phải việc gì cũng cần ưu tiên như nhau.', 'Quy tắc 80/20: phần lớn kết quả đến từ một số ít công việc quan trọng.'] },
    { t: 'Quân tranh & Cửu biến – Linh hoạt', p: ['Không có thế trận nào cố định; người chỉ huy phải biết biến hóa theo hoàn cảnh.', 'Kế hoạch dự án cần được cập nhật định kỳ. Khi điều kiện thay đổi (thời tiết, giá vật tư, thiết kế điều chỉnh), hãy chủ động đề xuất phương án thay thế thay vì cứng nhắc theo kế hoạch cũ.', 'Linh hoạt nhưng có nguyên tắc: mọi thay đổi đều cần được ghi nhận, đánh giá chi phí – thời gian và phê duyệt đúng quy trình.'] },
    { t: 'Hành quân & Địa hình – Hiểu hiện trường', p: ['Tôn Tử dành nhiều phần nói về quan sát địa hình, dấu hiệu của đối phương và cách bố trí quân.', 'Với người làm xây dựng: hãy xuống hiện trường thường xuyên. Báo cáo giấy tờ không thay thế được việc tận mắt thấy mặt bằng, chất lượng thi công và tinh thần đội thợ.', 'Những dấu hiệu nhỏ – vật tư về chậm, công nhân giảm, nhà thầu phụ né tránh – thường báo trước rủi ro lớn.'] },
    { t: 'Dụng gián – Thông tin là sức mạnh', p: ['Tôn Tử coi trọng thông tin chính xác và kịp thời hơn mọi thứ, vì đó là nền tảng của mọi quyết định đúng.', 'Ngày nay, "thông tin" là dữ liệu dự án: khối lượng, chi phí, tiến độ, rủi ro được cập nhật liên tục trên bảng điều khiển (dashboard).', 'Đầu tư vào hệ thống báo cáo minh bạch, số liệu đúng – đó là cách người quản lý "biết người biết ta" trong thời đại số.'] }
  ] },
  taichinh: { title: 'Cẩm nang tài chính cá nhân cho người đi làm', author: 'Claude biên soạn', genre: 'fin', level: 'Cơ bản', ch: [
    { t: 'Biết tiền đi đâu', p: ['Bước đầu tiên của quản lý tài chính không phải là đầu tư, mà là biết rõ mỗi tháng mình thu bao nhiêu, chi vào đâu.', 'Hãy ghi chép thu chi ít nhất 3 tháng liên tục. Bạn sẽ ngạc nhiên vì những khoản nhỏ như cà phê, ăn ngoài, mua sắm online cộng lại khá lớn.', 'Mẹo: ghi ngay khi phát sinh, chia thành vài danh mục chính, cuối tháng xem lại để tìm khoản có thể cắt giảm.'] },
    { t: 'Lập ngân sách đơn giản', p: ['Một cách phổ biến là chia thu nhập theo tỷ lệ: phần cho nhu cầu thiết yếu, phần cho mong muốn cá nhân và phần cho tiết kiệm – đầu tư. Tỷ lệ cụ thể tùy hoàn cảnh mỗi người.', 'Quan trọng nhất là "trả cho mình trước": ngay khi nhận lương, chuyển một phần cố định sang tài khoản tiết kiệm rồi mới chi tiêu phần còn lại.', 'Đặt hạn mức cho từng danh mục và theo dõi hằng tuần để điều chỉnh kịp thời.'] },
    { t: 'Quỹ dự phòng', p: ['Quỹ dự phòng giúp bạn vượt qua biến cố như mất việc, ốm đau, sửa chữa đột xuất mà không phải vay mượn.', 'Mức thường được khuyên là đủ chi tiêu thiết yếu trong 3–6 tháng; người có thu nhập không ổn định nên để nhiều hơn.', 'Để quỹ ở nơi an toàn, dễ rút: tài khoản tiết kiệm có kỳ hạn ngắn hoặc gửi linh hoạt.'] },
    { t: 'Quản lý nợ thông minh', p: ['Phân biệt nợ tốt (giúp tạo tài sản, thu nhập) và nợ xấu (chi tiêu tiêu dùng lãi cao).', 'Ưu tiên trả các khoản lãi cao trước, đặc biệt là dư nợ thẻ tín dụng. Luôn thanh toán đúng hạn để giữ lịch sử tín dụng tốt.', 'Theo dõi tổng tiền lãi phải trả mỗi tháng và tỷ lệ nợ trên tài sản – nếu tỷ lệ này cao, hãy ưu tiên giảm nợ trước khi đầu tư mới.'] },
    { t: 'Đầu tư dài hạn', p: ['Chỉ đầu tư khi đã có quỹ dự phòng và kiểm soát được nợ.', 'Đa dạng hóa: không dồn hết vào một kênh. Mỗi kênh (tiết kiệm, vàng, chứng khoán, bất động sản…) có mức rủi ro và thanh khoản khác nhau.', 'Đầu tư đều đặn trong thời gian dài và tránh quyết định theo cảm xúc. Đây không phải lời khuyên đầu tư cụ thể – hãy tìm hiểu kỹ hoặc hỏi chuyên gia trước khi quyết định.'] },
    { t: 'Theo dõi tài sản ròng', p: ['Tài sản ròng = Tổng tài sản có − Tổng nợ. Đây là thước đo sức khỏe tài chính quan trọng nhất.', 'Cập nhật tài sản ròng mỗi tháng hoặc mỗi quý. Mục tiêu là con số này tăng dần theo thời gian.', 'Mục Tài chính trong app này giúp bạn làm việc đó tự động: báo cáo, thu chi, ngân sách, vay nợ, tiết kiệm, tài sản và tài khoản.'] }
  ] },
  qlda: { title: 'Sổ tay quản lý dự án xây dựng thực hành', author: 'Claude biên soạn', genre: 'pro', level: 'Người đi làm', ch: [
    { t: 'Khởi động dự án đúng cách', p: ['Một dự án tốt bắt đầu từ việc hiểu rõ mục tiêu của chủ đầu tư: phạm vi, ngân sách, thời gian và tiêu chuẩn chất lượng.', 'Lập danh sách các bên liên quan (chủ đầu tư, tư vấn, nhà thầu, chính quyền, người dân xung quanh) và cách thức liên lạc với từng bên.', 'Họp khởi động (kick-off) để thống nhất quy trình báo cáo, phê duyệt, thanh toán ngay từ đầu.'] },
    { t: 'Kiểm soát phạm vi và phát sinh', p: ['Phát sinh là nguyên nhân hàng đầu gây vượt chi phí và tranh chấp.', 'Mọi thay đổi cần có văn bản: yêu cầu, đánh giá ảnh hưởng chi phí – tiến độ, phê duyệt trước khi thi công.', 'Lập sổ theo dõi phát sinh (đề xuất, đã duyệt, đang chờ, bị từ chối) và cập nhật trong mỗi cuộc họp giao ban.'] },
    { t: 'Tiến độ và đường găng', p: ['Lập tiến độ tổng thể và tiến độ chi tiết theo tuần. Xác định các công việc trên đường găng – chậm một ngày là chậm cả dự án.', 'So sánh kế hoạch và thực tế hằng tuần; khi chậm, tìm nguyên nhân gốc và đề xuất biện pháp bù tiến độ.', 'Báo cáo tiến độ nên ngắn gọn: đã xong gì, đang làm gì, vướng gì, cần ai hỗ trợ.'] },
    { t: 'Quản lý chi phí và dòng tiền', p: ['Theo dõi ba con số: giá trị hợp đồng, giá trị đã thực hiện (nghiệm thu) và giá trị đã thanh toán.', 'Lập kế hoạch dòng tiền theo tháng để chủ động hồ sơ thanh toán và tránh thiếu vốn.', 'Phân tích chênh lệch dự toán – thực tế theo từng hạng mục để phát hiện sớm nguy cơ vượt chi phí.'] },
    { t: 'Chất lượng và an toàn', p: ['Chất lượng được quyết định ở hiện trường: vật liệu đầu vào, biện pháp thi công và nghiệm thu từng công đoạn.', 'An toàn lao động là ưu tiên số một: huấn luyện, trang bị bảo hộ, kiểm tra hằng ngày, xử lý ngay các vi phạm.', 'Lưu trữ đầy đủ biên bản, hình ảnh, kết quả thí nghiệm – đó là bằng chứng khi nghiệm thu và quyết toán.'] },
    { t: 'Kết thúc và quyết toán', p: ['Lập danh mục tồn đọng (punch list) trước khi bàn giao và theo dõi đến khi hoàn thành.', 'Chuẩn bị hồ sơ hoàn công, hồ sơ quyết toán song song trong quá trình thi công, không để dồn đến cuối.', 'Tổ chức họp rút kinh nghiệm: điều gì làm tốt, điều gì cần cải thiện cho dự án sau.'] }
  ] },
  songkhoe: { title: 'Sống khỏe cho người bận rộn', author: 'Claude biên soạn', genre: 'health', level: 'Mọi người', ch: [
    { t: 'Ngủ đủ – nền tảng của năng suất', p: ['Giấc ngủ giúp cơ thể phục hồi và trí nhớ được củng cố. Phần lớn người trưởng thành cần khoảng 7–9 giờ mỗi đêm.', 'Giữ giờ ngủ – thức đều đặn, hạn chế màn hình điện thoại 30–60 phút trước khi ngủ, tránh cà phê vào buổi chiều tối.', 'Một giấc ngủ trưa ngắn 15–20 phút có thể giúp tỉnh táo hơn cho buổi chiều.'] },
    { t: 'Vận động mỗi ngày', p: ['Không cần phòng tập đắt tiền: đi bộ nhanh, chạy bộ, đạp xe, bơi lội đều tốt.', 'Mục tiêu đơn giản: vận động vừa phải khoảng 30 phút mỗi ngày, phần lớn các ngày trong tuần.', 'Với người ngồi nhiều: cứ khoảng một giờ hãy đứng dậy, vươn vai, đi lại vài phút.'] },
    { t: 'Ăn uống cân bằng', p: ['Ăn nhiều rau xanh, trái cây; chọn đạm từ cá, thịt nạc, đậu; hạn chế đồ chiên rán, đồ ngọt và nước ngọt.', 'Uống đủ nước trong ngày, nhất là khi làm việc ngoài công trường nắng nóng.', 'Hạn chế rượu bia trong các buổi tiếp khách – có thể chủ động gọi đồ uống không cồn.'] },
    { t: 'Quản lý căng thẳng', p: ['Áp lực công việc là điều khó tránh; quan trọng là có cách xả stress lành mạnh: thể thao, đọc sách, trò chuyện với người thân.', 'Thử thở chậm vài phút khi căng thẳng: hít vào sâu, thở ra chậm.', 'Nếu căng thẳng kéo dài, mất ngủ, chán nản – hãy chia sẻ với người tin cậy và tìm gặp chuyên gia y tế.'] },
    { t: 'Khám sức khỏe định kỳ', p: ['Khám định kỳ giúp phát hiện sớm các vấn đề như huyết áp, đường huyết, mỡ máu.', 'Ghi lại các chỉ số và lịch khám vào mục Sức khỏe và Lịch của app để được nhắc.', 'Dùng thuốc đúng theo chỉ định của bác sĩ; mục Uống thuốc giúp nhắc giờ và theo dõi số thuốc còn lại. Nội dung này chỉ mang tính tham khảo, không thay thế tư vấn y tế.'] }
  ] }
});

  kyluat: { title: 'Kỷ luật bản thân – 30 ngày xây thói quen tốt', author: 'Claude biên soạn', genre: 'dev', sub: 'Rèn luyện kỷ luật', level: 'Mọi người', ch: [
    { t: 'Vì sao ý chí thôi là chưa đủ', p: ['Phần lớn chúng ta bắt đầu thay đổi bằng quyết tâm rất lớn, nhưng chỉ vài tuần sau mọi thứ trở lại như cũ. Lý do không phải vì bạn yếu đuối, mà vì ý chí giống như một chiếc pin: dùng nhiều sẽ cạn.', 'Người có kỷ luật không phải là người lúc nào cũng gồng mình chống lại cám dỗ. Họ khéo léo sắp xếp môi trường và lịch trình để việc đúng trở nên dễ làm, còn việc sai trở nên khó làm.', 'Vì vậy, thay vì hỏi "làm sao để cố gắng hơn", hãy hỏi "làm sao để việc này tự nhiên hơn".'] },
    { t: 'Bắt đầu thật nhỏ', p: ['Một thói quen bền vững thường bắt đầu từ một hành động nhỏ đến mức không thể thất bại: đọc 2 trang sách, chống đẩy 5 cái, học 5 từ tiếng Anh.', 'Mục tiêu của 2 tuần đầu không phải là kết quả, mà là "có mặt" mỗi ngày. Khi việc xuất hiện đều đặn đã thành nếp, bạn mới tăng dần khối lượng.', 'Quy tắc 2 phút: nếu một thói quen mới mất hơn 2 phút để bắt đầu, hãy rút gọn nó lại.'] },
    { t: 'Gắn thói quen vào lịch có sẵn', p: ['Cách dễ nhất để nhớ làm một việc mới là gắn nó ngay sau một việc bạn vẫn làm hằng ngày.', 'Ví dụ: "Sau khi pha cà phê buổi sáng, tôi ôn 10 thẻ từ tiếng Anh." "Sau khi họp giao ban, tôi cập nhật bảng tiến độ."', 'Viết rõ công thức "Sau khi … tôi sẽ …" và dán ở nơi dễ thấy trong tuần đầu tiên.'] },
    { t: 'Theo dõi và không bỏ lỡ hai lần', p: ['Đánh dấu mỗi ngày bạn hoàn thành thói quen. Nhìn chuỗi ngày liên tục tạo ra cảm giác thỏa mãn và động lực tiếp tục.', 'Ai cũng có ngày bận rộn và lỡ nhịp. Nguyên tắc quan trọng: không bao giờ bỏ lỡ hai lần liên tiếp. Một lần lỡ là tai nạn, hai lần là bắt đầu một thói quen mới – thói quen bỏ cuộc.', 'Mục Kế hoạch › Thói quen trong app giúp bạn đánh dấu và xem chuỗi ngày.'] },
    { t: 'Thiết kế môi trường', p: ['Muốn đọc sách nhiều hơn: đặt sách lên gối hoặc bàn làm việc. Muốn bớt dùng điện thoại: để điện thoại ở phòng khác khi làm việc sâu.', 'Muốn ăn uống lành mạnh: để trái cây ở chỗ dễ thấy, cất đồ ăn vặt vào chỗ khó lấy.', 'Môi trường âm thầm quyết định hành vi nhiều hơn ta tưởng.'] },
    { t: 'Kế hoạch 30 ngày', p: ['Tuần 1: chọn một thói quen duy nhất, làm phiên bản 2 phút mỗi ngày, đánh dấu chuỗi.', 'Tuần 2: giữ nhịp, thêm một chút thời lượng. Tuần 3: gắn thói quen thứ hai vào sau thói quen thứ nhất.', 'Tuần 4: nhìn lại – điều gì dễ, điều gì khó, điều chỉnh môi trường. Sau 30 ngày, bạn có một nền móng vững để tiếp tục xây thêm.'] }

  tamly: { title: 'Tâm lý học ứng dụng trong công việc', author: 'Claude biên soạn', genre: 'psy', sub: 'Tâm lý học ứng dụng', level: 'Người đi làm', ch: [
    { t: 'Những thiên kiến khiến ta quyết định sai', p: ['Bộ não thích lối tắt. Hiệu ứng mỏ neo khiến con số đầu tiên ta nghe thấy ảnh hưởng mạnh đến đánh giá sau đó – như giá chào thầu đầu tiên trong đàm phán.', 'Thiên kiến xác nhận khiến ta chỉ tìm thông tin ủng hộ điều mình đã tin. Thiên kiến lạc quan khiến ta ước lượng tiến độ và chi phí thấp hơn thực tế.', 'Cách giảm sai lầm: dùng dữ liệu của các dự án tương tự, hỏi ý kiến người phản biện, và viết ra lý do trước khi quyết định.'] },
    { t: 'Động lực của con người', p: ['Tiền lương quan trọng, nhưng khi đã đủ sống, con người được thúc đẩy mạnh hơn bởi ba điều: quyền tự chủ, cơ hội tiến bộ và ý nghĩa của công việc.', 'Người quản lý giỏi giao mục tiêu rõ ràng nhưng để nhân viên tự chọn cách làm, ghi nhận tiến bộ kịp thời và giải thích vì sao công việc quan trọng.', 'Một lời cảm ơn cụ thể ("bản dự toán em làm rất chi tiết, giúp anh trả lời chủ đầu tư nhanh") có tác dụng hơn lời khen chung chung.'] },
    { t: 'Lắng nghe để thấu hiểu', p: ['Phần lớn chúng ta nghe để trả lời, không phải để hiểu. Lắng nghe chủ động là tập trung, đặt câu hỏi mở và nhắc lại ý chính của người nói.', 'Ví dụ: "Như vậy anh lo nhất là việc vật tư về chậm sẽ ảnh hưởng tới mốc bàn giao, đúng không?"', 'Khi người khác cảm thấy được hiểu, họ sẵn sàng hợp tác hơn – đây là nền tảng của mọi cuộc đàm phán và xử lý xung đột.'] },
    { t: 'Quản lý cảm xúc khi áp lực', p: ['Khi căng thẳng, não chuyển sang chế độ phản ứng nhanh: dễ cáu, dễ quyết định vội.', 'Hãy tạo khoảng dừng: hít thở sâu vài nhịp, gọi tên cảm xúc của mình ("mình đang bực vì bị trách oan"), rồi mới phản hồi.', 'Với email hay tin nhắn gây bức xúc, viết nháp rồi để sau 30 phút mới gửi – quyết định sẽ sáng suốt hơn.'] },
    { t: 'Ảnh hưởng và thuyết phục', p: ['Con người dễ đồng ý hơn với người họ quý mến, người có uy tín, và khi thấy người khác cũng đồng ý.', 'Trong công việc: xây dựng uy tín bằng sự chính xác và giữ lời; dùng dẫn chứng từ dự án thực tế; nêu lợi ích cho chính người nghe.', 'Thuyết phục bền vững luôn dựa trên sự trung thực – thao túng có thể thắng một lần nhưng mất niềm tin lâu dài.'] }
  ] },
  lichsu: { title: 'Lược sử Việt Nam qua các thời kỳ', author: 'Claude biên soạn', genre: 'hist', sub: 'Lịch sử Việt Nam', level: 'Phổ thông', ch: [
    { t: 'Thời dựng nước: Văn Lang – Âu Lạc', p: ['Theo truyền thuyết, các vua Hùng lập nên nhà nước Văn Lang, nhà nước đầu tiên của người Việt, gắn với nền văn hóa Đông Sơn nổi tiếng với trống đồng.', 'Sau đó Thục Phán – An Dương Vương lập nước Âu Lạc, xây thành Cổ Loa với hệ thống vòng thành xoắn ốc độc đáo.', 'Thời kỳ này để lại nền móng văn hóa lúa nước, tín ngưỡng thờ cúng tổ tiên và tinh thần cộng đồng làng xã.'] },
    { t: 'Thời Bắc thuộc và các cuộc khởi nghĩa', p: ['Hơn một nghìn năm, nước ta chịu sự đô hộ của các triều đại phong kiến phương Bắc. Dù vậy, người Việt vẫn giữ được tiếng nói và phong tục.', 'Nhiều cuộc khởi nghĩa nổ ra: Hai Bà Trưng, Bà Triệu, Lý Bí lập nước Vạn Xuân, Mai Thúc Loan, Phùng Hưng, họ Khúc giành quyền tự chủ.', 'Năm 938, Ngô Quyền đánh tan quân Nam Hán trên sông Bạch Đằng bằng trận địa cọc ngầm, mở ra thời kỳ độc lập lâu dài.'] },
    { t: 'Ngô – Đinh – Tiền Lê – Lý', p: ['Sau loạn 12 sứ quân, Đinh Bộ Lĩnh thống nhất đất nước, lập nước Đại Cồ Việt. Lê Hoàn tiếp nối, đánh thắng quân Tống.', 'Năm 1010, Lý Thái Tổ dời đô về Đại La, đổi tên là Thăng Long. Nhà Lý phát triển Phật giáo, lập Văn Miếu, mở khoa thi.', 'Lý Thường Kiệt chủ động đánh sang đất Tống rồi chặn quân Tống trên sông Như Nguyệt – gắn với bài thơ "Nam quốc sơn hà" được xem như tuyên ngôn độc lập.'] },
    { t: 'Nhà Trần và ba lần thắng quân Nguyên Mông', p: ['Thế kỷ XIII, quân Mông – Nguyên ba lần xâm lược Đại Việt và đều bị đánh bại.', 'Hưng Đạo Đại vương Trần Quốc Tuấn với "Hịch tướng sĩ" khích lệ tinh thần, cùng chiến thắng Bạch Đằng năm 1288 lặp lại cách đánh cọc ngầm của Ngô Quyền.', 'Bài học quản trị: đoàn kết từ trên xuống dưới (Hội nghị Diên Hồng hỏi ý kiến các bô lão), linh hoạt chiến thuật và tận dụng địa hình.'] },
    { t: 'Lê sơ – Mạc – Trịnh Nguyễn – Tây Sơn', p: ['Lê Lợi cùng Nguyễn Trãi lãnh đạo khởi nghĩa Lam Sơn, giành độc lập năm 1428; "Bình Ngô đại cáo" ra đời. Thời Lê Thánh Tông, bộ luật Hồng Đức được ban hành.', 'Sau đó đất nước trải qua thời Nam – Bắc triều, rồi Trịnh – Nguyễn phân tranh kéo dài.', 'Phong trào Tây Sơn của anh em Nguyễn Nhạc, Nguyễn Huệ, Nguyễn Lữ đánh tan quân Xiêm (Rạch Gầm – Xoài Mút) và quân Thanh (Ngọc Hồi – Đống Đa, Tết Kỷ Dậu 1789).'] },
    { t: 'Nhà Nguyễn và thời cận – hiện đại', p: ['Năm 1802, Nguyễn Ánh lập nhà Nguyễn, đóng đô ở Phú Xuân (Huế), lấy quốc hiệu Việt Nam.', 'Từ giữa thế kỷ XIX, thực dân Pháp xâm lược. Nhiều phong trào yêu nước nối tiếp nhau cho đến Cách mạng tháng Tám 1945 và Tuyên ngôn độc lập ngày 2/9/1945.', 'Trải qua các cuộc kháng chiến và thống nhất đất nước năm 1975, từ năm 1986 Việt Nam bước vào thời kỳ Đổi mới, phát triển kinh tế và hội nhập quốc tế.'] }
